<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-label="光学选型练习"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#25485e" stroke-width=".55"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5ce1d3"/></marker></defs><rect width="1600" height="650" rx="20" fill="#102a3d"/><rect width="1600" height="650" rx="20" fill="url(#grid)"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="62" font-size="34" fill="#f0f7fa" font-weight="700" text-anchor="start">光学选型练习</text><text x="48" y="105" font-size="20" fill="#abc8d7" font-weight="400" text-anchor="start">严格采用任务书近似公式 β = h / H = f / WD；实际镜头还要检查最短物距、畸变与实测视野</text><rect x="55" y="180" width="450" height="270" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="75" y="218" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">已知条件</text><text x="75" y="256" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">传感器：6.4 × 4.6 mm</text><text x="75" y="286" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">示例：WD 400 / 视野 160</text><text x="75" y="316" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">练习：WD 150 mm</text><text x="75" y="346" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">练习：视野至少 16 × 12 mm</text><rect x="575" y="180" width="450" height="270" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="595" y="218" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">双方向计算</text><text x="595" y="256" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">讲解例题：f = 16 mm</text><text x="595" y="286" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">水平方向：f ≤ 60 mm</text><text x="595" y="316" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">垂直方向：f ≤ 57.5 mm</text><text x="595" y="346" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">两个方向都满足：取较小上限</text><rect x="1095" y="180" width="450" height="270" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="1115" y="218" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">课内参考数值</text><text x="1115" y="256" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">以 50 mm 为理论示例</text><text x="1115" y="286" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">预测视野：19.2 × 13.8 mm</text><text x="1115" y="316" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">60 mm 不能满足垂直视野</text><text x="1115" y="346" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">不是实际器件采购或标定结论</text><text x="55" y="535" font-size="21" fill="#bdd8e1" font-weight="400" text-anchor="start">这里的 WD 使用任务书定义；近距离成像不能忽略真实镜头主面位置、最近对焦与机械工作距离差异。</text></g></svg>