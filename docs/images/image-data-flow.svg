<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="550" viewBox="0 0 1600 550" role="img" aria-label="图像与数据记录"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#25485e" stroke-width=".55"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5ce1d3"/></marker></defs><rect width="1600" height="550" rx="20" fill="#102a3d"/><rect width="1600" height="550" rx="20" fill="url(#grid)"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="62" font-size="34" fill="#f0f7fa" font-weight="700" text-anchor="start">图像与数据记录</text><text x="48" y="105" font-size="20" fill="#abc8d7" font-weight="400" text-anchor="start">对应任务书的原图保存、结果图保存、数据表与用户日志要求</text><rect x="55" y="195" width="320" height="205" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="75" y="233" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">建立本次记录</text><text x="75" y="271" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">UTC 时间戳</text><text x="75" y="301" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">样例编号与数据来源</text><text x="75" y="331" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">合成样例标记为 true</text><path d="M385 290H428" fill="none" stroke="#5ce1d3" stroke-width="3" marker-end="url(#arrow)"/><rect x="445" y="195" width="320" height="205" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="465" y="233" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">保存图像</text><text x="465" y="271" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">SourceImage_时间戳</text><text x="465" y="301" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">RecordImage_时间戳</text><text x="465" y="331" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">完整图像与结果标注</text><path d="M775 290H818" fill="none" stroke="#5ce1d3" stroke-width="3" marker-end="url(#arrow)"/><rect x="835" y="195" width="320" height="205" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="855" y="233" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">写入数据表</text><text x="855" y="271" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">CSV：结果与文件路径</text><text x="855" y="301" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">JSON：每项计算数值</text><text x="855" y="331" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">区分示例与实测数据</text><path d="M1165 290H1208" fill="none" stroke="#5ce1d3" stroke-width="3" marker-end="url(#arrow)"/><rect x="1225" y="195" width="320" height="205" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="1245" y="233" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">记录执行过程</text><text x="1245" y="271" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">用户日志 JSONL</text><text x="1245" y="301" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">输出只保存在指定目录</text><text x="1245" y="331" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">已有结果目录不覆盖</text><text x="55" y="480" font-size="21" fill="#b6d4e0" font-weight="400" text-anchor="start">所有提交的示例数值由实际执行的离线程序计算；图像与标定坐标的合成来源单独保留。</text></g></svg>