<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="550" viewBox="0 0 1600 550" role="img" aria-label="PCB 传统视觉检测"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#25485e" stroke-width=".55"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5ce1d3"/></marker></defs><rect width="1600" height="550" rx="20" fill="#102a3d"/><rect width="1600" height="550" rx="20" fill="url(#grid)"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="62" font-size="34" fill="#f0f7fa" font-weight="700" text-anchor="start">PCB 传统视觉检测</text><text x="48" y="105" font-size="20" fill="#abc8d7" font-weight="400" text-anchor="start">新增离线参考实现：固定位置的合成训练图；原 V+ 模板与工具保留供实机接入</text><rect x="55" y="195" width="320" height="205" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="75" y="233" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">图像与定位前提</text><text x="75" y="271" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">960 × 640 合成样例</text><text x="75" y="301" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">固定 ROI 布局</text><text x="75" y="331" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">实际图像须先定位配准</text><path d="M385 290H428" fill="none" stroke="#5ce1d3" stroke-width="3" marker-end="url(#arrow)"/><rect x="445" y="195" width="320" height="205" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="465" y="233" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">器件检测计算</text><text x="465" y="271" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">电阻：灰度方差</text><text x="465" y="301" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">电容：橙 / 绿颜色比例</text><text x="465" y="331" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">芯片：暗像素比例</text><path d="M775 290H818" fill="none" stroke="#5ce1d3" stroke-width="3" marker-end="url(#arrow)"/><rect x="835" y="195" width="320" height="205" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="855" y="233" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">结果汇总与标记</text><text x="855" y="271" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">逐器件判定 OK / NG</text><text x="855" y="301" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">绘制结果框与文字</text><text x="855" y="331" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">保留原图和计算数值</text><path d="M1165 290H1208" fill="none" stroke="#5ce1d3" stroke-width="3" marker-end="url(#arrow)"/><rect x="1225" y="195" width="320" height="205" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="1245" y="233" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">结果保存与复现</text><text x="1245" y="271" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">CSV / JSON / PNG</text><text x="1245" y="301" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">生成离线结果页面</text><text x="1245" y="331" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">记录数据来源与用户日志</text><text x="55" y="480" font-size="21" fill="#b6d4e0" font-weight="400" text-anchor="start">真实相机图像、光照变化、姿态变化及生产阈值仍需独立验证；不将合成样例结果称为现场精度。</text></g></svg>