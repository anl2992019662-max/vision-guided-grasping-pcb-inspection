<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="550" viewBox="0 0 1600 550" role="img" aria-label="视觉引导与取放流程"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#25485e" stroke-width=".55"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5ce1d3"/></marker></defs><rect width="1600" height="550" rx="20" fill="#102a3d"/><rect width="1600" height="550" rx="20" fill="url(#grid)"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="62" font-size="34" fill="#f0f7fa" font-weight="700" text-anchor="start">视觉引导与取放流程</text><text x="48" y="105" font-size="20" fill="#abc8d7" font-weight="400" text-anchor="start">基线包含示教和取放子流程；新程序验证平面坐标计算与指令构造</text><rect x="55" y="195" width="320" height="205" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="75" y="233" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">九点与标准位</text><text x="75" y="271" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">采集像素 / 机器人坐标对</text><text x="75" y="301" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">检查配对与非共线条件</text><text x="75" y="331" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">示例坐标明确为合成数据</text><path d="M385 290H428" fill="none" stroke="#5ce1d3" stroke-width="3" marker-end="url(#arrow)"/><rect x="445" y="195" width="320" height="205" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="465" y="233" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">拟合二维映射</text><text x="465" y="271" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">最小二乘仿射拟合</text><text x="465" y="301" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">报告拟合残差</text><text x="465" y="331" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">验证未参与拟合的点</text><path d="M775 290H818" fill="none" stroke="#5ce1d3" stroke-width="3" marker-end="url(#arrow)"/><rect x="835" y="195" width="320" height="205" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="855" y="233" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">生成目标与指令</text><text x="855" y="271" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">像素点映射到机器人 XY</text><text x="855" y="301" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">显式检查各轴范围</text><text x="855" y="331" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">构造 x / y / z / a 指令</text><path d="M1165 290H1208" fill="none" stroke="#5ce1d3" stroke-width="3" marker-end="url(#arrow)"/><rect x="1225" y="195" width="320" height="205" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="1245" y="233" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">实机取放接入</text><text x="1245" y="271" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">核对串口、坐标系和行程</text><text x="1245" y="301" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">重新标定与示教</text><text x="1245" y="331" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">确认反馈后执行取放</text><text x="55" y="480" font-size="21" fill="#b6d4e0" font-weight="400" text-anchor="start">二维平面仿射示例不等同于三维手眼标定；本项目离线演示只生成运动字符串，不发送给设备。</text></g></svg>