<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-label="系统连接与数据交互"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#25485e" stroke-width=".55"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5ce1d3"/></marker></defs><rect width="1600" height="760" rx="20" fill="#102a3d"/><rect width="1600" height="760" rx="20" fill="url(#grid)"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="62" font-size="34" fill="#f0f7fa" font-weight="700" text-anchor="start">系统连接与数据交互</text><text x="48" y="105" font-size="20" fill="#abc8d7" font-weight="400" text-anchor="start">来源：培训任务书 + 已核对的基线配置；示例通信编解码由本项目补充</text><rect x="55" y="195" width="365" height="180" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="75" y="233" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">相机 / 光学 / 光源</text><text x="75" y="271" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">相机 IP：192.168.1.33</text><text x="75" y="301" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">环形光源与独立控制器</text><text x="75" y="331" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">光源串口：COM1 或 COM2</text><rect x="565" y="195" width="400" height="180" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="585" y="233" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">工控机处理</text><text x="585" y="271" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">PC IP：192.168.1.44</text><text x="585" y="301" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">采图 → 检测 → 坐标映射</text><text x="585" y="331" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">原图 / 结果图 / CSV / 日志</text><rect x="1120" y="170" width="420" height="170" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="1140" y="208" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">PLC</text><text x="1140" y="246" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">H5U：192.168.1.20 : 502</text><text x="1140" y="276" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">Word 0：启动控制</text><text x="1140" y="306" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">Word 1：结果反馈</text><rect x="1120" y="435" width="420" height="170" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="1140" y="473" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">机械手与气泵</text><text x="1140" y="511" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">COM7，基线串口 115200</text><text x="1140" y="541" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">回零 / 运动模式 / 查询</text><text x="1140" y="571" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">坐标字符串与吸吹气控制</text><path d="M420 275H550" fill="none" stroke="#5ce1d3" stroke-width="3" marker-end="url(#arrow)"/><path d="M965 255H1104" fill="none" stroke="#5ce1d3" stroke-width="3" marker-end="url(#arrow)"/><path d="M965 305H1030V505H1104" fill="none" stroke="#5ce1d3" stroke-width="3" marker-end="url(#arrow)"/><rect x="55" y="465" width="910" height="150" rx="12" fill="#17394e" stroke="#5ce1d3" stroke-width="1.4"/><text x="75" y="503" font-size="24" fill="#eff9fd" font-weight="700" text-anchor="start">运行层次</text><text x="75" y="541" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">保留原始培训基线；离线程序可独立运行并生成标注样例。</text><text x="75" y="571" font-size="19" fill="#d7e7ee" font-weight="400" text-anchor="start">实机层需要实际相机、PLC 程序、机械手型号、光源协议和重新标定。</text><text x="55" y="700" font-size="21" fill="#b8d5df" font-weight="400" text-anchor="start">H5U 支持 Modbus TCP 与 Socket；本项目新增的 Modbus 示例需要与现场 PLC 地址表核对。</text></g></svg>