[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-vision-national-prep"
version = "1.0.0"
description = "Offline reference implementation for planar vision guidance and PCB inspection training"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "anl2992019662-max"}]
dependencies = ["numpy>=1.26,<3", "Pillow>=10.1,<13"]

[project.scripts]
visionprep = "visionprep.__main__:main"

[project.urls]
Repository = "https://github.com/anl2992019662-max/machine-vision-national-prep"

[tool.setuptools.packages.find]
include = ["visionprep*"]
